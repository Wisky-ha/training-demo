[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-training-platform-backend"
version = "0.1.0"
description = "FastAPI backend foundation for the model training visualization platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "numpy>=2.0,<3.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.4,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.uvicorn]
app = "app.main:app"
host = "127.0.0.1"
port = 8000

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
